# Prometheus alerting rules for Healthcare Voice AI
groups:
  - name: healthcare-voice-ai.rules
    rules:
      # Application Health Alerts
      - alert: ApplicationDown
        expr: up{job="healthcare-voice-ai"} == 0
        for: 1m
        labels:
          severity: critical
          service: healthcare-voice-ai
        annotations:
          summary: "Healthcare Voice AI application is down"
          description: "The Healthcare Voice AI application has been down for more than 1 minute."

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
          service: healthcare-voice-ai
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} errors per second for the last 5 minutes."

      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
          service: healthcare-voice-ai
        annotations:
          summary: "High response time detected"
          description: "95th percentile response time is {{ $value }} seconds."

      # System Resource Alerts
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is {{ $value }}% on {{ $labels.instance }}."

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is {{ $value }}% on {{ $labels.instance }}."

      - alert: HighDiskUsage
        expr: (1 - (node_filesystem_avail_bytes / node_filesystem_size_bytes)) * 100 > 90
        for: 5m
        labels:
          severity: critical
          service: system
        annotations:
          summary: "High disk usage detected"
          description: "Disk usage is {{ $value }}% on {{ $labels.instance }}."

      # Database Alerts
      - alert: DatabaseConnectionFailure
        expr: database_connections == 0
        for: 1m
        labels:
          severity: critical
          service: database
        annotations:
          summary: "Database connection failure"
          description: "Unable to connect to the database."

      - alert: HighDatabaseConnections
        expr: database_connections > 80
        for: 5m
        labels:
          severity: warning
          service: database
        annotations:
          summary: "High database connection count"
          description: "Database has {{ $value }} active connections."

      # Redis Alerts
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
          service: redis
        annotations:
          summary: "Redis is down"
          description: "Redis service is not responding."

      - alert: HighRedisMemoryUsage
        expr: redis_memory_used_bytes / redis_memory_max_bytes * 100 > 80
        for: 5m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "High Redis memory usage"
          description: "Redis memory usage is {{ $value }}%."

      # SSL Certificate Alerts
      - alert: SSLCertificateExpiringSoon
        expr: ssl_certificate_expiry_seconds < 7 * 24 * 3600
        for: 1h
        labels:
          severity: warning
          service: ssl
        annotations:
          summary: "SSL certificate expiring soon"
          description: "SSL certificate for {{ $labels.domain }} expires in {{ $value | humanizeDuration }}."

      - alert: SSLCertificateExpired
        expr: ssl_certificate_expiry_seconds < 0
        for: 0m
        labels:
          severity: critical
          service: ssl
        annotations:
          summary: "SSL certificate has expired"
          description: "SSL certificate for {{ $labels.domain }} has expired."

      # Security Alerts
      - alert: HighFailedLoginAttempts
        expr: rate(auth_failed_attempts_total[5m]) > 10
        for: 2m
        labels:
          severity: warning
          service: security
        annotations:
          summary: "High number of failed login attempts"
          description: "{{ $value }} failed login attempts per second detected."

      - alert: SuspiciousActivity
        expr: rate(suspicious_requests_total[5m]) > 5
        for: 1m
        labels:
          severity: warning
          service: security
        annotations:
          summary: "Suspicious activity detected"
          description: "{{ $value }} suspicious requests per second detected."

      # File Upload Alerts
      - alert: HighFileUploadRate
        expr: rate(file_uploads_total[5m]) > 100
        for: 5m
        labels:
          severity: warning
          service: file-upload
        annotations:
          summary: "High file upload rate"
          description: "{{ $value }} file uploads per second detected."

      - alert: QuarantinedFiles
        expr: increase(quarantined_files_total[1h]) > 10
        for: 0m
        labels:
          severity: warning
          service: file-upload
        annotations:
          summary: "High number of quarantined files"
          description: "{{ $value }} files quarantined in the last hour."

      # Voice AI Alerts
      - alert: VAPIServiceDown
        expr: up{job="vapi"} == 0
        for: 2m
        labels:
          severity: critical
          service: voice-ai
        annotations:
          summary: "VAPI service is down"
          description: "VAPI service is not responding."

      - alert: HighVoiceCallFailureRate
        expr: rate(voice_calls_failed_total[5m]) / rate(voice_calls_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          service: voice-ai
        annotations:
          summary: "High voice call failure rate"
          description: "Voice call failure rate is {{ $value | humanizePercentage }}."

      # Business Logic Alerts
      - alert: NoAppointmentsScheduled
        expr: increase(appointments_scheduled_total[1h]) == 0
        for: 1h
        labels:
          severity: info
          service: business
        annotations:
          summary: "No appointments scheduled in the last hour"
          description: "No appointments have been scheduled in the last hour."

      - alert: HighAppointmentCancellationRate
        expr: rate(appointments_cancelled_total[1h]) / rate(appointments_scheduled_total[1h]) > 0.3
        for: 30m
        labels:
          severity: warning
          service: business
        annotations:
          summary: "High appointment cancellation rate"
          description: "Appointment cancellation rate is {{ $value | humanizePercentage }}."

      # Compliance Alerts
      - alert: AuditLogFailure
        expr: rate(audit_log_failures_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
          service: compliance
        annotations:
          summary: "Audit log failures detected"
          description: "{{ $value }} audit log failures per second detected."

      - alert: DataRetentionViolation
        expr: data_retention_violations_total > 0
        for: 0m
        labels:
          severity: critical
          service: compliance
        annotations:
          summary: "Data retention violation detected"
          description: "{{ $value }} data retention violations detected."

      # Performance Alerts
      - alert: SlowDatabaseQueries
        expr: histogram_quantile(0.95, rate(database_query_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
          service: database
        annotations:
          summary: "Slow database queries detected"
          description: "95th percentile database query time is {{ $value }} seconds."

      - alert: HighCacheMissRate
        expr: rate(cache_misses_total[5m]) / rate(cache_requests_total[5m]) > 0.5
        for: 5m
        labels:
          severity: warning
          service: cache
        annotations:
          summary: "High cache miss rate"
          description: "Cache miss rate is {{ $value | humanizePercentage }}."

      # Infrastructure Alerts
      - alert: ContainerRestart
        expr: increase(container_restarts_total[5m]) > 0
        for: 0m
        labels:
          severity: warning
          service: infrastructure
        annotations:
          summary: "Container restart detected"
          description: "Container {{ $labels.container_name }} has restarted {{ $value }} times in the last 5 minutes."

      - alert: OutOfMemory
        expr: increase(container_oom_kills_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
          service: infrastructure
        annotations:
          summary: "Out of memory kill detected"
          description: "Container {{ $labels.container_name }} was killed due to out of memory."

      # Network Alerts
      - alert: HighNetworkLatency
        expr: histogram_quantile(0.95, rate(network_latency_seconds_bucket[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
          service: network
        annotations:
          summary: "High network latency detected"
          description: "95th percentile network latency is {{ $value }} seconds."

      - alert: NetworkPacketLoss
        expr: rate(network_packets_dropped_total[5m]) > 0.01
        for: 5m
        labels:
          severity: warning
          service: network
        annotations:
          summary: "Network packet loss detected"
          description: "Network packet loss rate is {{ $value | humanizePercentage }}."
