# Healthcare Voice AI - Unified Docker Compose Configuration
# Supports multiple environments via profiles: dev, prod, ssl, monitoring, test

version: '3.8'

services:
  # Main application - Development
  app:
    build:
      context: .
      target: development
    container_name: healthcare-voice-ai-app
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=debug
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - VAPI_API_KEY=${VAPI_API_KEY}
      - GOOGLE_CALENDAR_ID=${GOOGLE_CALENDAR_ID}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./src:/app/src
      - ./prompts:/app/prompts
      - ./scripts:/app/scripts
      - ./tests:/app/tests
      - ./logs:/app/logs
    depends_on:
      - redis
    networks:
      - healthcare-voice-ai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
      - dev

  # Main application - Production
  app-prod:
    build:
      context: .
      target: production
    container_name: healthcare-voice-ai-app-prod
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - JWT_SECRET=${JWT_SECRET}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - VAPI_API_KEY=${VAPI_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - DEBUG=false
      - CORS_ORIGINS=https://${DOMAIN:-healthcare-voice-ai.com}
    volumes:
      - app_logs:/app/logs
    depends_on:
      - redis
    networks:
      - healthcare-voice-ai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
      - prod
      - ssl

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: healthcare-voice-ai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - healthcare-voice-ai-network
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - dev
      - prod
      - ssl
      - test

  # PostgreSQL for local development (optional)
  postgres:
    image: postgres:15-alpine
    container_name: healthcare-voice-ai-postgres
    environment:
      - POSTGRES_DB=healthcare_voice_ai
      - POSTGRES_USER=healthcare_user
      - POSTGRES_PASSWORD=healthcare_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - healthcare-voice-ai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthcare_user -d healthcare_voice_ai"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - dev

  # Nginx reverse proxy (production without SSL)
  nginx:
    image: nginx:alpine
    container_name: healthcare-voice-ai-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/dental-voice-ai.conf:/etc/nginx/conf.d/default.conf
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - app-prod
    networks:
      - healthcare-voice-ai-network
    restart: unless-stopped
    profiles:
      - prod

  # Nginx SSL/TLS Reverse Proxy
  nginx-ssl:
    build:
      context: ./docker/nginx-ssl
      dockerfile: Dockerfile
    container_name: healthcare-voice-ai-nginx-ssl
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-healthcare-voice-ai.com}
      - EMAIL=${EMAIL:-admin@healthcare-voice-ai.com}
      - BACKEND_HOST=app-prod
      - BACKEND_PORT=8000
    volumes:
      - ssl_certs:/etc/letsencrypt
      - ssl_logs:/var/log/ssl-renewal
      - nginx_logs:/var/log/nginx
    depends_on:
      - app-prod
    restart: unless-stopped
    networks:
      - healthcare-voice-ai-network
    profiles:
      - ssl

  # SSL Certificate Renewal Service
  ssl-renewal:
    image: certbot/certbot
    container_name: healthcare-voice-ai-ssl-renewal
    volumes:
      - ssl_certs:/etc/letsencrypt
      - ssl_logs:/var/log/ssl-renewal
    command: sh -c "trap exit TERM; while :; do certbot renew --quiet --no-self-upgrade; sleep 12h & wait $${!}; done;"
    restart: unless-stopped
    networks:
      - healthcare-voice-ai-network
    profiles:
      - ssl

  # Monitoring stack
  prometheus:
    image: prom/prometheus:latest
    container_name: healthcare-voice-ai-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - healthcare-voice-ai-network
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: healthcare-voice-ai-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - healthcare-voice-ai-network
    restart: unless-stopped
    profiles:
      - monitoring

  # Node exporter for system metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: healthcare-voice-ai-node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - healthcare-voice-ai-network
    restart: unless-stopped
    profiles:
      - monitoring

  # Redis exporter for Redis metrics
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: healthcare-voice-ai-redis-exporter
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    depends_on:
      - redis
    networks:
      - healthcare-voice-ai-network
    restart: unless-stopped
    profiles:
      - monitoring

  # Testing service
  test:
    build:
      context: .
      target: development
    container_name: healthcare-voice-ai-test
    environment:
      - ENVIRONMENT=test
      - LOG_LEVEL=debug
      - SUPABASE_URL=${SUPABASE_URL_TEST}
      - SUPABASE_KEY=${SUPABASE_KEY_TEST}
    volumes:
      - ./src:/app/src
      - ./prompts:/app/prompts
    depends_on:
      - redis
    networks:
      - healthcare-voice-ai-network
    command: ["pytest", "tests/", "-v", "--cov=healthcare_voice_ai"]
    profiles:
      - test

  # Database migration service
  migrate:
    build:
      context: .
      target: development
    container_name: healthcare-voice-ai-migrate
    environment:
      - ENVIRONMENT=development
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    volumes:
      - ./src:/app/src
    networks:
      - healthcare-voice-ai-network
    command: ["echo", "Migration scripts not implemented yet"]
    profiles:
      - migrate

  # Backup service
  backup:
    build:
      context: .
      target: development
    container_name: healthcare-voice-ai-backup
    environment:
      - ENVIRONMENT=production
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    volumes:
      - ./backups:/app/backups
    networks:
      - healthcare-voice-ai-network
    command: ["echo", "Backup scripts not implemented yet"]
    profiles:
      - backup

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  ssl_certs:
    driver: local
  ssl_logs:
    driver: local
  nginx_logs:
    driver: local
  app_logs:
    driver: local

networks:
  healthcare-voice-ai-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16